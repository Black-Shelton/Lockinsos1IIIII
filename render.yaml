services:
  - type: web
    name: noob-experiment-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    autoDeploy: true
    # Сейчас DATA_DIR не задан — бот хранит БД и фото карт рядом со скриптом,
    # как и раньше (на free-плане это стирается при каждом деплое).
    # Персистентный диск Render доступен только на платных планах (Starter и выше).
    # Чтобы база данных и фото карт переживали деплой, раскомментируй блок ниже целиком
    # и смени plan: free на plan: starter (или другой платный план):
    # envVars:
    #   - key: DATA_DIR
    #     value: /var/data
    # disk:
    #   name: noob-bot-data
    #   mountPath: /var/data
    #   sizeGB: 1
